name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblzma-dev mtools syslinux isolinux xorriso
      - name: Build iPXE assets
        run: bash scripts/build-ipxe-assets.sh assets
      - uses: actions/upload-artifact@v4
        with:
          name: ipxe-assets
          path: assets/

  build:
    needs: assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/download-artifact@v4
        with:
          name: ipxe-assets
          path: assets
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BIN="ipxe-manager"
          if [ "$GOOS" = "windows" ]; then
            BIN="ipxe-manager.exe"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" ./cmd/ipxe-manager
          STAGE="dist/stage_${GOOS}_${GOARCH}"
          mkdir -p "$STAGE"
          cp "dist/${BIN}" "$STAGE/"
          cp -a assets "$STAGE/"
          (
            cd "$STAGE"
            if [ "$GOOS" = "windows" ]; then
              zip -r "../ipxe-manager_${VERSION}_${GOOS}_${GOARCH}.zip" .
            else
              tar -czf "../ipxe-manager_${VERSION}_${GOOS}_${GOARCH}.tar.gz" .
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  docker:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipxe-assets
          path: assets
      - name: Set image metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/rack-auto-iso"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release
          merge-multiple: true
      - name: List archives
        run: ls -lh release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/songxwn/rack-auto-iso:${{ github.ref_name }}
            # 或
            docker compose up -d
            ```

            镜像: `ghcr.io/songxwn/rack-auto-iso:${{ github.ref_name }}` / `:latest`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
